project_id = "gympro-uae"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/**"]
enable_signup = true

[auth.email.template.invite]
subject = "Join your gym team — choose your password"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Choose your GymPro password"
content_path = "./supabase/templates/recovery.html"

[functions.invite-employee]
verify_jwt = true

[functions.process-reminders]
verify_jwt = false

[functions.employee-login]
verify_jwt = false

[functions.test-push]
verify_jwt = false
